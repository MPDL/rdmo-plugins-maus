{% load i18n %}

<div class="form-inline checkbox custom-checkbox" >
    {% if sortable %}
        <div
            class="drag-icon fa fa-arrows drag custom-checkbox-drag"
            id="{{ field_id }}_drag_icon_{{ index }}"
            draggable="true"
        ></div>
    {% endif %}
    <label class="multivalue-checkbox" >
        {% with checkbox=widget.subwidgets.0 text=widget.subwidgets.1 %}
            <span class="multivalue-checkbox-checkbox" >
                {% include "django/forms/widgets/input.html" with widget=checkbox %}
                {{ checkbox.label }}
            </span>
            {% if text %}
                <span
                    id="{{ field_id }}_file_path_{{ index }}"
                    class="multivalue-checkbox-text"
                    style="display: {% if widget.selected %}flex{% else %}none{% endif %};"
                >
                    {{ text.label }}
                    {% include "django/forms/widgets/input.html" with widget=text %}
                </span>
            {% endif %}
        {% endwith %}
    </label>
</div>
{% if widget.warnings %}
    <div id="{{ field_id }}_warnings_{{ index }}" class="help-block error" >
        {% for warning in widget.warnings %}
            <p class="text-warning">* {{ warning }}</p>
        {% endfor %}
    </div>
{% endif %}
{% if widget.errors %}
    <div id="{{ field_id }}_errors_{{ index }}" class="help-block error" >
        {% for error in widget.errors %}
            <p class="text-danger">* {{ error.message }}</p>
        {% endfor %}
    </div>
{% endif %}
