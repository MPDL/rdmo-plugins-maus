{% if sortable %}
    <div class="select-all-checkbox-slot" >
        {% include "django/forms/widgets/input.html" with widget=checkbox %}
    </div>
{% endif %}
<label {% if sortable %} class="multivalue-checkbox select-all-label" {% else %} class="multivalue-checkbox" {% endif %} for="{{ checkbox.attrs.id }}" >
    <span class="multivalue-checkbox-checkbox" >
        {% if not sortable %}
            {% include "django/forms/widgets/input.html" with widget=checkbox %}
        {% endif %}
        {{ checkbox.label }}
    </span>
</label>
